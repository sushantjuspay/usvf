---
# ========================
# 1. Base Setup
# ========================
kolla_base_distro: "ubuntu"
kolla_install_type: "source"
openstack_release: "2024.1"

# Fix for Ubuntu Noble (24.04) which uses Python 3.12
# Kolla-Ansible defaults to "3" but Noble containers have python3.12
distro_python_version: "3.12"

# ========================
# 2. Networking (Underlay)
# ========================
# VIP on Controller Loopbacks (Anycast)
kolla_internal_vip_address: "10.100.0.254"
enable_keepalived: "no"

# Bind services to Host Loopbacks
api_interface_address: "{{ api_ip }}"
tunnel_interface_address: "{{ tunnel_ip }}"

# -----------------------------------------------------------------
# PURE BGP EXTERNAL (No Physical Bridge)
# -----------------------------------------------------------------
# The Agent will attach routes to this interface.
neutron_external_interface: "dum-ex"
network_interface: "lo1"
# ========================
# 3. OVN Configuration
# ========================
neutron_plugin_agent: "ovn"
neutron_tunnel_type: "geneve"
enable_neutron_dvr: "yes"
enable_neutron_provider_networks: "yes"
neutron_ovn_distributed_fip: "yes"

# ========================
# 4. OVN BGP AGENT
# ========================
enable_neutron_bgp_dragent: "no"
enable_ovn_bgp_agent: "yes"

# The NB Driver is perfect for this. It simply syncs OVN DB -> Kernel Routes.
ovn_bgp_agent_driver: "nb_ovn_bgp_driver"

# -----------------------------------------------------------------
# 5. FRR Handling
# -----------------------------------------------------------------
# We disable Kolla's FRR because we use the Host FRR.
# We DO NOT map volumes because we rely on 'redistribute kernel'.
enable_frr: "no"

# ========================
# 6. Core Services
# ========================
enable_horizon: "yes"
enable_heat: "yes"
enable_fluentd: "yes"
enable_cinder: "yes"
cinder_cluster_name: "ceph"

# Metrics 
enable_aodh: "yes"
enable_gnocchi: "yes"      # Required for GnocchiAggregationByMetricsAlarm
enable_ceilometer: "yes"   # Required to collect the metrics

# ========================
# 7. Ceph Configuration (External Cluster)
# ========================
# Glance - Store images in Ceph
glance_backend_ceph: "yes"
glance_backend_file: "no"
ceph_glance_keyring: "client.glance.keyring"
ceph_glance_user: "glance"
ceph_glance_pool_name: "images"

# Cinder - Block storage with Ceph RBD
enable_cinder_backend_lvm: "no"
cinder_backend_ceph: "yes"
ceph_cinder_keyring: "client.cinder.keyring"
ceph_cinder_user: "cinder"
ceph_cinder_pool_name: "volumes"

# Cinder Backup to Ceph
cinder_backup_driver: "ceph"
ceph_cinder_backup_keyring: "client.cinder-backup.keyring"
ceph_cinder_backup_user: "cinder-backup"
ceph_cinder_backup_pool_name: "backups"

# Nova - Ephemeral disks and live migration with Ceph
nova_backend_ceph: "yes"
ceph_nova_keyring: "client.nova.keyring"
ceph_nova_user: "nova"
ceph_nova_pool_name: "vms"

# ========================
# 8. Ceph RadosGW - Object Storage (Swift API Compatible)
# ========================
# Enable Ceph RadosGW integration for Object Store (Containers) in Horizon
enable_ceph_rgw: "yes"

# Enable Swift API compatibility on RadosGW
# This allows Horizon to show Object Store > Containers panel
ceph_rgw_swift_compatibility: "yes"

# Enable load balancing for RadosGW endpoints via HAProxy
enable_ceph_rgw_loadbalancer: "yes"

# RadosGW hosts and ports
# IMPORTANT: Update these based on your deployment:
#
# For 3-node converged: RGW runs on hypervisor-1,2,3 (192.168.10.11-13)
# For 5-node separated: RGW runs on hypervisor-4.example,5 (192.168.10.14-15)

# Current configuration for 3-node converged setup:
# ceph_rgw_hosts:
#   - host: 192.168.10.11
#     port: 7480
#   - host: 192.168.10.12
#     port: 7480
#   - host: 192.168.10.13
#     port: 7480

# For 5-node separated setup, replace above with:
ceph_rgw_hosts:
  - host: 192.168.10.14
    port: 7480
  - host: 192.168.10.15
    port: 7480

# HAProxy frontend port for RadosGW (accessible via VIP)
# Port 6780 is the default and is not used by any other OpenStack service
ceph_rgw_port: 6780

# Enable Keystone integration for RadosGW (required for Horizon authentication)
enable_ceph_rgw_keystone: "yes"

# Swift account in URL (should match RadosGW rgw_swift_account_in_url setting)
ceph_rgw_swift_account_in_url: "yes"